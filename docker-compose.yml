services:
  postgres:
    image: postgres:16
    container_name: clamped-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clamped_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - see .env.example}
    ports:
      - "5432:5432"
    volumes:
      - clamped-pgdata:/var/lib/postgresql/data

volumes:
  clamped-pgdata:
